<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<style>
:root{--bg:#f4f6fb;--line:#e5e9f0;--line2:#eef1f6;--text:#0b1220;--text2:#334155;--muted:#64748b;--brand:#4f46e5;--brand2:#4338ca;--brandsoft:#eef2ff;--ring:rgba(79,70,229,.15);--ok:#059669;--oksoft:#ecfdf5;--warn:#d97706;--warnsoft:#fffbeb;--bad:#dc2626;--badsoft:#fef2f2;--radius:14px}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%;font-family:'Inter',system-ui,sans-serif}
body{background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;transition:all .15s}
input,select,textarea{font-family:inherit;width:100%;padding:11px 14px;border-radius:8px;border:1.5px solid var(--line);background:#fff;color:var(--text);font-size:14px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px var(--ring)}
label{display:block;font-size:12.5px;color:var(--text2);margin-bottom:6px;font-weight:600}
table{width:100%;border-collapse:collapse}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line2);font-size:13.5px}
th{color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;background:#f9fafb}
tbody tr:hover{background:#f9fafb}
h1{font-size:22px;font-weight:700;margin:0 0 4px}
h3{font-size:15px;font-weight:700;margin:0 0 12px}
.muted{color:var(--muted);font-size:12.5px}
#app{display:flex;min-height:100vh;flex-direction:row-reverse}
#sidebar{width:250px;background:#0f172a;color:#cbd5e1;display:flex;flex-direction:column;padding:20px 14px;flex-shrink:0}
#sidebar .brand{display:flex;align-items:center;gap:10px;padding:6px 10px 20px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:16px}
#sidebar .brand .mark{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:grid;place-items:center;color:#fff;font-weight:800;font-size:16px}
#sidebar .brand .name{font-size:13.5px;font-weight:700;color:#fff}
#sidebar .brand .sub{font-size:10px;color:#94a3b8;letter-spacing:.06em;text-transform:uppercase}
#schoolBadge{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);padding:12px;border-radius:12px;margin-bottom:16px;font-size:12px;color:#e2e8f0}
#schoolBadge b{display:block;font-size:12.5px;font-weight:600;color:#fff;margin-bottom:3px;line-height:1.3}
#schoolBadge .muted{color:#8ea1bb;font-size:11px}
#sidebar nav{display:flex;flex-direction:column;gap:2px;overflow-y:auto;flex:1}
#sidebar nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font-size:13px;color:#cbd5e1;font-weight:500}
#sidebar nav a:hover{background:rgba(255,255,255,.06);color:#fff}
#sidebar nav a.active{background:linear-gradient(135deg,#4f46e5,#6366f1);color:#fff;font-weight:600}
#sidebar .logout{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font-size:13px;color:#94a3b8;margin-top:8px;border-top:1px solid rgba(255,255,255,.06);padding-top:14px}
#sidebar .logout:hover{color:#fca5a5}
#main{flex:1;padding:28px 36px;overflow:auto;min-width:0}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.page-head .sub{color:var(--muted);font-size:13px;margin-top:3px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:0 1px 3px rgba(15,23,42,.05)}
.grid{display:grid;gap:16px}
.grid-kpi{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.grid-2{grid-template-columns:1fr 1fr}
.grid-3{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
@media(max-width:900px){.grid-2,.grid-3{grid-template-columns:1fr}}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.kpi .v{font-size:24px;font-weight:700;letter-spacing:-.02em}
.kpi .l{color:var(--muted);font-size:12px;margin-top:4px;font-weight:500}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:600}
.badge.ok{background:var(--oksoft);color:#047857;border:1px solid #a7f3d0}
.badge.bad{background:var(--badsoft);color:#b91c1c;border:1px solid #fecaca}
.badge.info{background:var(--brandsoft);color:var(--brand2);border:1px solid #c7d2fe}
.badge.warn{background:var(--warnsoft);color:#92400e;border:1px solid #fde68a}
.badge.req{background:#e0e7ff;color:#3730a3;border:1px solid #a5b4fc}
.btn{background:var(--brand);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--brand2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--text2)}
.btn.ghost:hover{background:#f9fafb}
.btn.danger{background:var(--bad)}
.btn.ok{background:var(--ok)}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:8px}
.table-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line);background:#fff}
.toast{position:fixed;bottom:20px;left:20px;background:#0f172a;color:#fff;padding:12px 18px;border-radius:12px;z-index:100;font-size:13.5px;font-weight:500;box-shadow:0 20px 40px -12px rgba(15,23,42,.5)}
.toast.bad{background:#7f1d1d}
.toast.ok{background:#065f46}
.auth-bg{position:fixed;inset:0;background:radial-gradient(circle at 20% 20%,#4f46e5 0%,transparent 50%),radial-gradient(circle at 80% 80%,#7c3aed 0%,transparent 50%),#0b1220;display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;overflow:auto}
.auth-card{background:#fff;border-radius:20px;padding:36px;width:100%;max-width:440px;box-shadow:0 40px 80px -20px rgba(0,0,0,.5)}
.auth-card .logo{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,#4f46e5,#7c3aed);display:grid;place-items:center;color:#fff;font-weight:800;font-size:22px;margin:0 auto 16px}
.auth-card h1{text-align:center;font-size:19px;margin:0 0 6px}
.auth-card .sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:22px}
.tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:22px}
.tabs button{flex:1;padding:11px;font-size:14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent}
.tabs button.active{color:var(--brand);border-bottom-color:var(--brand)}
.err{background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;padding:11px 14px;border-radius:10px;margin-top:14px;font-size:13px}
.ok{background:#ecfdf5;border:1px solid #a7f3d0;color:#047857;padding:11px 14px;border-radius:10px;margin-top:14px;font-size:13px}
.loading{padding:60px;text-align:center;color:var(--muted);font-size:14px}
.empty{text-align:center;padding:50px 20px;color:var(--muted);font-size:14px}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:#fff;border-radius:16px;max-width:760px;width:100%;max-height:92vh;overflow:auto;padding:26px;box-shadow:0 30px 60px -20px rgba(0,0,0,.4)}
.modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid var(--line2);flex-wrap:wrap}
.wa-float{position:fixed;bottom:20px;right:20px;background:#25D366;color:#fff;padding:12px 18px;border-radius:50px;font-weight:600;z-index:999;text-decoration:none;box-shadow:0 10px 20px rgba(0,0,0,.2);display:flex;align-items:center;gap:8px;font-size:14px}
.wa-float:hover{background:#20BA5A;color:#fff}
@media(max-width:900px){
  #app{flex-direction:column}
  #sidebar{width:100%;flex-direction:column;padding:12px}
  #sidebar .brand{padding:0 0 10px;margin:0}
  #sidebar nav{flex-direction:row;overflow-x:auto;gap:6px;padding:6px 0}
  #sidebar nav a{flex:0 0 auto;padding:8px 12px;font-size:12.5px;background:rgba(255,255,255,.05);border-radius:999px}
  #main{padding:16px}
  .grid-kpi{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<a href="https://wa.me/254757208077" target="_blank" class="wa-float">💬 Need Help? WhatsApp Us</a>

<div class="auth-bg" id="authScreen">
  <div class="auth-card">
    <div class="logo">E</div>
    <h1>Eudes School Management</h1>

    <div class="tabs">

<div id="app" style="display:none">
  <aside id="sidebar">
    <div class="brand"><div class="mark">E</div><div><div class="name">Eudes S.M.</div><div class="sub">Powered by Eudes</div></div></div>
    <div id="schoolBadge"></div>

</div>

<script>
const SUPA_URL = 'https://wabeempxckdtjvrkzhpv.supabase.co';
const SUPA_KEY = 'sb_publishable_n0uAm0Gcq7qR2dJM4jMZGQ_wiV__Cfp';
const FUNC_FEE_DEFAULT = 70000;

let _memoryStore = {};
const safeStorage = {
  getItem: function(k) { try { return localStorage.getItem(k); } catch(e) { return _memoryStore[k] || null; } },
  setItem: function(k, v) { try { localStorage.setItem(k, v); } catch(e) { _memoryStore[k] = String(v); } },
  removeItem: function(k) { try { localStorage.removeItem(k); } catch(e) { delete _memoryStore[k]; } }
};
function getToken(){ const s = safeStorage.getItem('eudes_session'); if(!s) return null; try { return JSON.parse(s).access_token; } catch(e){ return null; } }
function getUser(){ const s = safeStorage.getItem('eudes_session'); if(!s) return null; try { return JSON.parse(s).user; } catch(e){ return null; } }
function setSession(d){ if(d){ safeStorage.setItem('eudes_session', JSON.stringify(d)); } else { safeStorage.removeItem('eudes_session'); } }

async function rest(path, options){
  options = options || {};
  const headers = Object.assign({ 'apikey': SUPA_KEY, 'Content-Type': 'application/json' }, options.headers || {});
  const token = getToken();
  headers['Authorization'] = 'Bearer ' + (token || SUPA_KEY);
  const res = await fetch(SUPA_URL + path, Object.assign({}, options, { headers: headers }));
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch(e){ data = text; }
  if(!res.ok){
    if (res.status === 401) { setSession(null); alert('Session expired. Please log in again.'); window.location.reload(); throw new Error('Session expired'); }
    const msg = (data && (data.message || data.msg || data.error_description || data.error)) || text || ('HTTP ' + res.status);
    throw new Error(msg);
  }
  return data;
}
async function auth(path, body){
  const res = await fetch(SUPA_URL + path, { method: 'POST', headers: { 'apikey': SUPA_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch(e){ data = text; }
  if(!res.ok){ const msg = (data && (data.message || data.msg || data.error_description || data.error)) || text || ('HTTP ' + res.status); throw new Error(msg); }
  return data;
}

let SESSION = null, _profile = null, _school = null, _schoolId = null, _role = null, _classesCache = null, _staffCache = null, _foodCache = null;

function toast(msg, type){
  const el = document.createElement('div');
  el.className = 'toast' + (type === 'bad' ? ' bad' : (type === 'ok' ? ' ok' : ''));
  el.textContent = msg;
  document.getElementById('toastRoot').appendChild(el);
  setTimeout(function(){ el.remove(); }, 3500);
}
function modal(html){
  const root = document.getElementById('modalRoot');
  root.innerHTML = '<div class="modal-bg"><div class="modal">' + html + '</div></div>';
  root.querySelector('.modal-bg').addEventListener('click', function(e){ if(e.target.classList.contains('modal-bg')) closeModal(); });
}
function closeModal(){ document.getElementById('modalRoot').innerHTML = ''; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function fmtUGX(n){ return 'UGX ' + (Number(n)||0).toLocaleString(); }
function fmtDate(ts){ if(!ts) return '—'; const d = new Date(ts); return String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0') + '/' + d.getFullYear(); }
window.toast = toast; window.modal = modal; window.closeModal = closeModal;

function switchTab(which){
  document.getElementById('tabLogin').classList.toggle('active', which === 'login');
  document.getElementById('tabRegister').classList.toggle('active', which === 'register');
  document.getElementById('loginForm').style.display = which === 'login' ? 'block' : 'none';
  document.getElementById('registerForm').style.display = which === 'register' ? 'block' : 'none';
}
window.switchTab = switchTab;

async function doLogin(){
  const email = document.getElementById('loginEmail').value.trim().toLowerCase();
  const pass = document.getElementById('loginPass').value;
  const err = document.getElementById('loginErr');
  const btn = document.getElementById('loginBtn');
  err.style.display = 'none';
  if(!email || !pass){ err.textContent = 'Enter email and password'; err.style.display = 'block'; return; }
  btn.disabled = true; btn.textContent = 'Signing in…';
  try { const data = await auth('/auth/v1/token?grant_type=password', { email: email, password: pass }); setSession(data); await boot(); }
  catch(e){ err.textContent = e.message; err.style.display = 'block'; }
  btn.disabled = false; btn.textContent = 'Sign In';
}
window.doLogin = doLogin;

async function doRegister(){
  const name = document.getElementById('regName').value.trim();
  const email = document.getElementById('regEmail').value.trim().toLowerCase();
  const pass = document.getElementById('regPass').value;
  const school = document.getElementById('regSchool').value.trim();
  const slug = document.getElementById('regSlug').value.trim().toLowerCase().replace(/[^a-z0-9-]/g,'-');
  const addr = document.getElementById('regAddr').value.trim();
  const phone = document.getElementById('regPhone').value.trim();
  const head = document.getElementById('regHead').value.trim();
  const motto = document.getElementById('regMotto').value.trim();
  const err = document.getElementById('regErr');
  const ok = document.getElementById('regOk');
  const btn = document.getElementById('regBtn');
  err.style.display = 'none'; ok.style.display = 'none';
  if(!name || !email || !pass || !school || !slug){ err.textContent = 'Fill all required fields'; err.style.display = 'block'; return; }
  if(pass.length < 8){ err.textContent = 'Password must be at least 8 characters'; err.style.display = 'block'; return; }
  btn.disabled = true; btn.textContent = 'Creating…';
  try {
    const data = await auth('/auth/v1/signup', { email: email, password: pass, data: { full_name: name } });
    if(!data.access_token){ ok.textContent = 'Check your email to confirm, then sign in.'; ok.style.display = 'block'; btn.disabled = false; btn.textContent = 'Create School'; return; }
    setSession(data);
    await rest('/rest/v1/rpc/create_school_and_become_owner', { method: 'POST', body: JSON.stringify({ p_school_name: school, p_school_slug: slug, p_motto: motto || null, p_address: addr || null, p_telephone: phone || null, p_email: email, p_head_teacher: head || null }) });
    ok.textContent = 'School created. Waiting for approval. WhatsApp +254757208077.'; ok.style.display = 'block';
    setTimeout(boot, 500);
  } catch(e){ err.textContent = e.message; err.style.display = 'block'; }
  btn.disabled = false; btn.textContent = 'Create School';
}
window.doRegister = doRegister;

async function doLogout(){
  try { const token = getToken(); if(token){ await fetch(SUPA_URL + '/auth/v1/logout', { method: 'POST', headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + token } }); } } catch(e){}
  setSession(null); SESSION = null; _profile = null; _school = null; _schoolId = null; _role = null;
  document.getElementById('app').style.display = 'none';
  document.getElementById('authScreen').style.display = 'flex';
}
window.doLogout = doLogout;

async function boot(){
  const user = getUser(); const token = getToken();
  if(!user || !token){ document.getElementById('authScreen').style.display = 'flex'; document.getElementById('app').style.display = 'none'; return; }
  SESSION = user;
  try { const profiles = await rest('/rest/v1/profiles?id=eq.' + user.id + '&select=*'); _profile = profiles && profiles[0]; }
  catch(e){ document.getElementById('authScreen').style.display = 'flex'; document.getElementById('loginErr').textContent = 'Profile not found'; document.getElementById('loginErr').style.display = 'block'; return; }
  if(!_profile){ document.getElementById('authScreen').style.display = 'flex'; document.getElementById('loginErr').textContent = 'Profile not found.'; document.getElementById('loginErr').style.display = 'block'; return; }
  _schoolId = _profile.school_id; _role = _profile.role;
  if(!_schoolId){
    document.getElementById('authScreen').style.display = 'flex'; switchTab('register');
    document.getElementById('regErr').textContent = 'Your account is not linked to a school.'; document.getElementById('regErr').style.display = 'block';
    document.getElementById('regName').parentElement.style.display = 'none';
    document.getElementById('regEmail').parentElement.style.display = 'none';
    document.getElementById('regPass').parentElement.style.display = 'none';
    document.getElementById('regBtn').textContent = 'Create School'; document.getElementById('regBtn').onclick = createSchoolOnly;
    return;
  }
  try { const schools = await rest('/rest/v1/schools?id=eq.' + _schoolId + '&select=*'); _school = schools && schools[0]; } catch(e){}
  if (!_school.is_approved) {
    document.getElementById('authScreen').style.display = 'flex'; document.getElementById('app').style.display = 'none';
    document.getElementById('loginErr').innerHTML = '⏳ Pending approval. WhatsApp +254757208077.';
    document.getElementById('loginErr').style.display = 'block'; return;
  }
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  renderBadge(); renderNav(); await nav('dashboard');
}
window.boot = boot;

async function createSchoolOnly(){
  const school = document.getElementById('regSchool').value.trim();
  const slug = document.getElementById('regSlug').value.trim().toLowerCase().replace(/[^a-z0-9-]/g,'-');
  const addr = document.getElementById('regAddr').value.trim();
  const phone = document.getElementById('regPhone').value.trim();
  const head = document.getElementById('regHead').value.trim();
  const motto = document.getElementById('regMotto').value.trim();
  const err = document.getElementById('regErr'); const btn = document.getElementById('regBtn');
  err.style.display = 'none';
  if(!school || !slug){ err.textContent = 'Fill school name and short name'; err.style.display = 'block'; return; }
  btn.disabled = true; btn.textContent = 'Creating…';
  try {
    await rest('/rest/v1/rpc/create_school_and_become_owner', { method: 'POST', body: JSON.stringify({ p_school_name: school, p_school_slug: slug, p_motto: motto || null, p_address: addr || null, p_telephone: phone || null, p_email: _profile.email || null, p_head_teacher: head || null }) });
    toast('School created. Pending approval.', 'ok');
    setTimeout(boot, 500);
  } catch(e){ err.textContent = e.message; err.style.display = 'block'; }
  btn.disabled = false; btn.textContent = 'Create School';
}
window.createSchoolOnly = createSchoolOnly;

function renderBadge(){
  const el = document.getElementById('schoolBadge');
  if(!_school){ el.innerHTML = '<b>School</b>'; return; }
  el.innerHTML = '<b>' + esc(_school.name) + '</b><div class="muted">' + esc(_school.address || '') + '</div><div class="muted" style="margin-top:3px">' + esc(_profile.full_name || SESSION.email) + ' · ' + esc((_profile.role||'').replace(/_/g,' ')) + '</div>';
}
window.renderBadge = renderBadge;

const ROUTES = {
  dashboard: { label:'Dashboard', icon:'📊', render: pageDashboard },
  attendance:{ label:'Rollcall', icon:'📅', render: pageAttendance },
  students:  { label:'Pupils', icon:'🎓', render: pageStudents },
  fees:      { label:'Fees', icon:'💰', render: pageFees },

async function nav(route){
  if(!ROUTES[route]) return;
  activeRoute = route; renderNav();
  const main = document.getElementById('main');
  main.innerHTML = '<div class="loading">Loading…</div>';
  try { await ROUTES[route].render(main); }
  catch(e){ main.innerHTML = '<div class="card"><h3>Error</h3><p class="muted">' + esc(e.message) + '</p></div>'; }
}
window.nav = nav;
function renderNav(){
  document.getElementById('nav').innerHTML = Object.entries(ROUTES).map(function(p){
    const k = p[0], r = p[1];
    return '<a href="#" class="' + (k === activeRoute ? 'active' : '') + '" onclick="nav(\'' + k + '\');return false;"><span style="width:18px;text-align:center">' + r.icon + '</span><span>' + esc(r.label) + '</span></a>';
  }).join('');
}

      '<div class="kpi" style="background:var(--oksoft);border-color:#a7f3d0"><div class="l" style="color:#047857">✅ Present Today</div><div class="v" style="color:#065f46;font-size:22px;margin-top:4px">' + presentToday + '</div></div>' +

function markAllPresent(){
  document.querySelectorAll('.att-select').forEach(sel => {
    sel.value = 'present';
    sel.style.background = '#dcfce7';
  });
  toast('All marked present. Click Save Rollcall.', 'ok');
}

async function saveAttendance(){
  const fClass = window._attClass; const fDate = window._attDate;
  const rows = [];
  document.querySelectorAll('.att-select').forEach(sel => {
    if(sel.value === '') return;
    rows.push({ school_id: _schoolId, student_id: sel.dataset.student, class_id: fClass, status: sel.value, date: fDate });
  });
  if(!rows.length){ toast('Nothing to save — no statuses selected', 'bad'); return; }
  try {
    await rest('/rest/v1/attendance?school_id=eq.' + _schoolId + '&class_id=eq.' + fClass + '&date=eq.' + fDate, { method: 'DELETE' });
    await rest('/rest/v1/attendance', { method: 'POST', headers: { 'Prefer': 'return=minimal' }, body: JSON.stringify(rows) });
    const abs = rows.filter(r => r.status === 'absent').length;
    toast('Rollcall saved: ' + (rows.length - abs) + ' present, ' + abs + ' absent', 'ok');
    nav('attendance');
  } catch(e){ toast(e.message, 'bad'); }
}
window.saveAttendance = saveAttendance;

async function loadStaff(){

}
async function pageStudents(root){
  const classes = await loadClasses();
  const [students, payments] = await Promise.all([
    rest('/rest/v1/students?school_id=eq.' + _schoolId + '&select=*&order=created_at.desc'),
    rest('/rest/v1/payments?school_id=eq.' + _schoolId + '&select=student_id,amount,payment_for')
  ]);
  window._allStudents = students || [];
  const paidByStudent = {};
  payments.forEach(p => { if (!paidByStudent[p.student_id]) paidByStudent[p.student_id] = { school: 0, func: 0 }; if (p.payment_for === 'Functional Fees') paidByStudent[p.student_id].func += Number(p.amount); else paidByStudent[p.student_id].school += Number(p.amount); });
  window._paidByStudent = paidByStudent;
  root.innerHTML =
    '<div class="page-head"><div><h1>Pupils</h1><div class="sub" id="studentCount">Loading…</div></div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
        '<button class="btn ghost" onclick="document.getElementById(\'excelInput\').click()">📄 Bulk Import</button>' +
        '<button class="btn" onclick="addStudent()">＋ Register Pupil</button>' +
      '</div></div>' +
    '<div class="card">' +
      '<div class="grid grid-3" style="margin-bottom:16px">' +
        '<input id="studentSearchInput" placeholder="Search name, adm no, LIN…" value="' + esc(window._stFilterSearch||'') + '" oninput="filterStudentsTable(this.value)">' +
        '<select id="studentClassFilter" onchange="filterStudentsTable(document.getElementById(\'studentSearchInput\').value, this.value)"><option value="">All classes</option>' + classes.map(c=>'<option value="' + c.id + '">' + esc(c.name) + '</option>').join('') + '</select>' +
        '<select id="studentFuncFilter" onchange="filterStudentsTable(document.getElementById(\'studentSearchInput\').value)"><option value="">All functional statuses</option><option value="pending">⏳ Pending</option><option value="cash">💵 Cash Paid</option><option value="requirements">📦 Requirements</option></select>' +
      '</div>' +
      '<div id="studentsTableContainer"></div>' +
    '</div>';
  filterStudentsTable(window._stFilterSearch || '', window._stFilterClass || '');
}
window.pageStudents = pageStudents;

function filterStudentsTable(q, fClass){
  q = (q || '').toLowerCase(); fClass = fClass || '';
  window._stFilterSearch = q; window._stFilterClass = fClass;
  const fFunc = document.getElementById('studentFuncFilter')?.value || '';
  const classes = _classesCache || [];
  const paid = window._paidByStudent || {};
  const filtered = (window._allStudents || []).filter(function(s){
    if(fClass && s.class_id !== fClass) return false;
    if(fFunc && s.functional_fee_status !== fFunc) return false;
    if(q){
      const hay = (s.first_name + ' ' + (s.last_name||'') + ' ' + s.admission_no + ' ' + (s.lin||'') + ' ' + (s.parent_name||'') + ' ' + (s.parent_contact||'')).toLowerCase();
      if(hay.indexOf(q) === -1) return false;
    }
    return true;
  });
  document.getElementById('studentCount').textContent = (window._allStudents||[]).length + ' total · ' + filtered.length + ' shown';
  const container = document.getElementById('studentsTableContainer');
  if (!filtered.length) { container.innerHTML = '<div class="empty">No pupils match your search.</div>'; return; }
  container.innerHTML = '<div class="table-wrap"><table>' +
    '<thead><tr><th>Adm No</th><th>Name</th><th>Class</th><th style="text-align:right">School Bal</th><th>Functional</th><th style="text-align:right">Actions</th></tr></thead>' +
    '<tbody>' + filtered.map(function(s){ return studentRow(s, classes, paid); }).join('') + '</tbody>' +
  '</table></div>';
}
window.filterStudentsTable = filterStudentsTable;

function studentRow(s, classes, paidByStudent){
  const cls = (classes||[]).find(function(c){ return c.id === s.class_id; });
  const schoolFee = (Number(s.balance_bf)||0) + (Number(s.actual_fee)||0) + (Number(s.transport_fee)||0);
  const p = paidByStudent[s.id] || { school: 0, func: 0 };
  const schoolBal = schoolFee - p.school;
  return '<tr>' +
    '<td><b>' + esc(s.admission_no) + '</b></td>' +
    '<td><b>' + esc(s.first_name + ' ' + (s.last_name||'')) + '</b><div class="muted" style="font-family:monospace;font-size:11px">' + esc(s.lin||'') + '</div></td>' +
    '<td><span class="badge info">' + esc(cls?cls.name:'—') + '</span></td>' +
    '<td style="text-align:right"><span class="badge ' + (schoolBal > 0 ? 'bad' : 'ok') + '">' + schoolBal.toLocaleString() + '</span></td>' +
    '<td>' + functionalStatusBadge(s.functional_fee_status) + '</td>' +
    '<td style="text-align:right;white-space:nowrap">' +
      '<button class="btn sm" onclick="recordPayment(\'' + s.id + '\')">💵 Pay</button> ' +
      '<button class="btn sm ghost" onclick="markFunctionalFee(\'' + s.id + '\',\'' + esc(s.first_name + ' ' + (s.last_name||'')) + '\',\'' + (s.functional_fee||FUNC_FEE_DEFAULT) + '\',\'' + (s.functional_fee_status||'pending') + '\')">🧾 Func</button> ' +
      '<button class="btn sm ghost" onclick="editStudent(\'' + s.id + '\')">Edit</button> ' +
      '<button class="btn sm danger" onclick="deleteStudent(\'' + s.id + '\')">✕</button>' +
    '</td></tr>';
}

function functionalStatusBadge(status){
  if (status === 'cash') return '<span class="badge ok">💵 Cash Paid</span>';
  if (status === 'requirements') return '<span class="badge req">📦 Requirements</span>';
  return '<span class="badge bad">⏳ Pending</span>';
}
window.functionalStatusBadge = functionalStatusBadge;

async function markFunctionalFee(id, name, funcFee, currentStatus){
  modal('<h3>🧾 Functional Fee — ' + esc(name) + '</h3>' +
    '<p class="muted" style="margin-bottom:16px">Requirement value: <b>' + fmtUGX(funcFee) + '</b></p>' +
    '<div style="display:flex;flex-direction:column;gap:10px">' +

async function handleExcelUpload(input){
  if (!input.files || input.files.length === 0) return;
  const file = input.files[0]; const reader = new FileReader();
  reader.onload = async function(e){
    try {
      toast('Reading Excel file...', 'ok');
      const data = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, { type: 'array' });
      const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });
      if (!rows || rows.length < 2) { toast('No data found', 'bad'); return; }
      const classes = await loadClasses();
      const studentsToInsert = []; const paymentPlans = [];
      for (let i = 1; i < rows.length; i++){
        const row = rows[i];
        if (!row || !row[1] || String(row[1]).trim() === '' || String(row[1]).trim() === 'Name') continue;
        const fullName = String(row[1]).trim(); const parts = fullName.split(' ');
        const fn = parts[0]; const ln = parts.slice(1).join(' ') || null;
        const className = String(row[2] || '').trim();
        let classId = null;
        if (className){
          const matched = classes.find(c => c.name.toLowerCase() === className.toLowerCase());
          if (matched){ classId = matched.id; }
          else { try { const newClass = await rest('/rest/v1/classes', { method: 'POST', headers: { 'Prefer': 'return=representation' }, body: JSON.stringify({ school_id: _schoolId, name: className, sort_order: 99 }) }); if (newClass && newClass[0]){ classId = newClass[0].id; classes.push({ id: classId, name: className }); _classesCache = classes; } } catch(err){} }
        }
        const getNum = (v) => { if (v===undefined||v===null||v==='') return 0; const c = String(v).replace(/[^0-9.-]/g,''); const n = parseFloat(c); return isNaN(n)?0:n; };
        const boardingStatus = String(row[3] || 'Day').trim();
        const parentContact = row[4] ? String(row[4]).trim() : null;
        const balanceBf = getNum(row[5]); const actualFee = getNum(row[7]);
        let functionalFee = getNum(row[10]); if (functionalFee === 0) functionalFee = FUNC_FEE_DEFAULT;
        const transportFee = getNum(row[12]);
        const dep1 = getNum(row[13]); const dep2 = getNum(row[14]); const dep3 = getNum(row[15]);
        const totalExpected = balanceBf + actualFee + transportFee;
        const studentIndex = studentsToInsert.length;
        studentsToInsert.push({
          school_id: _schoolId, admission_no: row[0] ? 'ADM-' + String(row[0]).trim() : 'ADM-' + Math.floor(Math.random()*10000),
          first_name: fn, last_name: ln, lin: generateLIN(fn), class_id: classId, boarding_status: boardingStatus,
          parent_contact: parentContact, balance_bf: balanceBf, actual_fee: actualFee, functional_fee: functionalFee,
          transport_fee: transportFee, total_expected: totalExpected, current_balance: totalExpected,
          functional_fee_status: 'pending', status: 'active'
        });
        if (dep1 > 0) paymentPlans.push({ tempIndex: studentIndex, amount: dep1, note: 'Imported (1st deposit)' });
        if (dep2 > 0) paymentPlans.push({ tempIndex: studentIndex, amount: dep2, note: 'Imported (2nd deposit)' });
        if (dep3 > 0) paymentPlans.push({ tempIndex: studentIndex, amount: dep3, note: 'Imported (3rd deposit)' });
      }
      if (!studentsToInsert.length){ toast('No valid records', 'bad'); return; }
      toast('Importing ' + studentsToInsert.length + ' students...', 'ok');
      const insertedIds = [];
      for (let i = 0; i < studentsToInsert.length; i += 50){
        const chunk = studentsToInsert.slice(i, i + 50);
        const res = await rest('/rest/v1/students', { method: 'POST', headers: { 'Prefer': 'return=representation' }, body: JSON.stringify(chunk) });
        if (Array.isArray(res)) res.forEach(r => insertedIds.push(r.id));
      }
      if (paymentPlans.length){
        const paymentRows = paymentPlans.map(p => ({ school_id: _schoolId, student_id: insertedIds[p.tempIndex], amount: p.amount, payment_for: 'School Fees', payment_method: 'Cash', notes: p.note })).filter(r => r.student_id);
        for (let i = 0; i < paymentRows.length; i += 50){ const chunk = paymentRows.slice(i, i + 50); await rest('/rest/v1/payments', { method: 'POST', headers: { 'Prefer': 'return=minimal' }, body: JSON.stringify(chunk) }); }
      }
      toast('Successfully imported ' + studentsToInsert.length + ' students!', 'ok');
      input.value = ''; nav('students');
    } catch (err){ toast('Error importing: ' + err.message, 'bad'); input.value = ''; }
  };
  reader.readAsArrayBuffer(file);
}
window.handleExcelUpload = handleExcelUpload;

  ]);

  window._allClassesForFees = classes || [];

  let totExpected = 0, totCollected = 0, totFuncExpected = 0, totFuncCash = 0, totFuncReq = 0, funcReqCount = 0, funcCashCount = 0, funcPendingCount = 0;

function exportFeesToExcel(){
  const list = window._allFeeStudents || [];
  const paid = window._paidByStudentFees || {};
  const classes = window._allClassesForFees || [];
  if (!list.length){ toast('No data to export', 'bad'); return; }
  const exportData = list.map(s => {
    const cls = classes.find(c => c.id === s.class_id);
    const schoolFee = (Number(s.balance_bf)||0) + (Number(s.actual_fee)||0) + (Number(s.transport_fee)||0);
    const funcFee = Number(s.functional_fee)||FUNC_FEE_DEFAULT;
    const p = paid[s.id] || { school: 0, func: 0 };
    const schoolBal = schoolFee - p.school;
    let funcStatus = 'Pending';
    if (s.functional_fee_status === 'cash') funcStatus = 'Paid in Cash';
    else if (s.functional_fee_status === 'requirements') funcStatus = 'Provided Requirements';
    return {
      "Adm No": s.admission_no, "Name": s.first_name + ' ' + (s.last_name || ''), "Class": cls ? cls.name : '—', "LIN": s.lin || '—',
      "School Fee Expected": schoolFee, "School Fee Paid": p.school, "School Fee Balance": schoolBal,
      "Functional Status": funcStatus,
      "Functional Fee Value": funcFee,
      "Functional Fee Cash Paid": p.func
    };
  });
  const ws = XLSX.utils.json_to_sheet(exportData);
  ws['!cols'] = [{wch:12},{wch:25},{wch:10},{wch:12},{wch:20},{wch:18},{wch:18},{wch:22},{wch:20},{wch:22}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Fees Report");
  XLSX.writeFile(wb, "Fees_Report_" + new Date().toISOString().slice(0,10) + ".xlsx");
  toast('Exported to Excel!', 'ok');
}
window.exportFeesToExcel = exportFeesToExcel;

function filterFeesTable(){
  const fClass = document.getElementById('feesClassFilter')?.value || '';
  const mode = document.getElementById('feesOwingFilter')?.value || 'all';
  const paid = window._paidByStudentFees || {};
  let list = window._allFeeStudents || [];
  if (fClass) list = list.filter(s => s.class_id === fClass);
  if (mode === 'owing') list = list.filter(s => { const schoolFee = (Number(s.balance_bf)||0) + (Number(s.actual_fee)||0) + (Number(s.transport_fee)||0); const p = paid[s.id] || { school: 0 }; return (schoolFee - p.school) > 0; });
  if (mode === 'func_pending') list = list.filter(s => s.functional_fee_status === 'pending' || !s.functional_fee_status);
  const container = document.getElementById('feesTableContainer');
  if (!list.length){ container.innerHTML = '<div class="empty">No pupils match filters.</div>'; return; }
  container.innerHTML = '<div class="table-wrap"><table>' +
    '<thead><tr><th>Adm No</th><th>Name</th><th>Class</th><th style="text-align:right">School Exp.</th><th style="text-align:right">Paid</th><th style="text-align:right">School Bal</th><th>Functional</th><th style="text-align:right">Actions</th></tr></thead>' +
    '<tbody>' + list.map(s => {
      const cls = (window._allClassesForFees||[]).find(c => c.id === s.class_id);
      const schoolFee = (Number(s.balance_bf)||0) + (Number(s.actual_fee)||0) + (Number(s.transport_fee)||0);

async function recordPayment(id){
  const [students, payments] = await Promise.all([
    rest('/rest/v1/students?id=eq.' + id + '&select=*'),
    rest('/rest/v1/payments?student_id=eq.' + id + '&select=amount,payment_for')
  ]);
  const s = students[0]; if(!s) return;
  const schoolFee = (Number(s.balance_bf)||0) + (Number(s.actual_fee)||0) + (Number(s.transport_fee)||0);
  const funcFee = Number(s.functional_fee)||FUNC_FEE_DEFAULT;
  const schoolPaid = payments.filter(p => p.payment_for !== 'Functional Fees').reduce((sum,p) => sum + Number(p.amount), 0);
  const schoolBal = schoolFee - schoolPaid;
  const now = new Date(); const tz = now.getTimezoneOffset() * 60000; const localISO = new Date(now - tz).toISOString().slice(0,16);
  modal('<h3>💵 Record Payment — ' + esc(s.first_name + ' ' + (s.last_name||'')) + '</h3>' +
    '<div style="background:var(--brandsoft);padding:12px;border-radius:10px;margin-bottom:16px;font-size:13px;line-height:1.8">' +
      '<div>📚 <b>School Fees Balance:</b> ' + fmtUGX(schoolBal) + '</div>' +
      '<div>🧾 <b>Functional Status:</b> ' + functionalStatusBadge(s.functional_fee_status) + ' (Value ' + fmtUGX(funcFee) + ')</div>' +
    '</div>' +
    '<div class="grid grid-2">' +
      '<div><label>Payment For *</label><select id="p_for"><option value="School Fees">📚 School Fees</option><option value="Functional Fees">🧾 Functional Fee (Cash)</option></select></div>' +
      '<div><label>Amount (UGX) *</label><input id="p_amount" type="number"></div>' +
      '<div><label>Payment Method *</label><select id="p_method" onchange="toggleTxnIdField()"><option value="Cash">💵 Cash</option><option value="Mobile Money">📱 Mobile Money</option><option value="Bank Transfer">🏦 Bank Transfer</option><option value="Cheque">📝 Cheque</option></select></div>' +
      '<div><label>Date & Time Paid *</label><input id="p_date" type="datetime-local" value="' + localISO + '"></div>' +
      '<div id="txnIdField" style="display:none"><label>Transaction ID / Reference *</label><input id="p_txn"></div>' +
      '<div><label>Notes (Optional)</label><input id="p_notes"></div>' +
    '</div>' +
    '<div class="actions"><button class="btn ghost" onclick="closeModal()">Cancel</button>' +
      '<button class="btn ok" onclick="savePayment(\'' + id + '\')">💾 Save Payment</button></div>');
}
window.recordPayment = recordPayment;

function toggleTxnIdField(){
  const method = document.getElementById('p_method').value;
  const field = document.getElementById('txnIdField');
  if (method === 'Cash'){ field.style.display = 'none'; document.getElementById('p_txn').value = ''; }
  else { field.style.display = 'block'; }
}
window.toggleTxnIdField = toggleTxnIdField;

async function savePayment(id){
  const payFor = document.getElementById('p_for').value;
  const amount = parseFloat(document.getElementById('p_amount').value);
  const method = document.getElementById('p_method').value;
  const txn = (document.getElementById('p_txn')?.value || '').trim();
  const dateVal = document.getElementById('p_date').value;
  const notes = document.getElementById('p_notes').value.trim();
  if (!amount || amount <= 0){ toast('Enter a valid amount', 'bad'); return; }
  if (method !== 'Cash' && !txn){ toast('Transaction ID required for ' + method, 'bad'); return; }
  if (!dateVal){ toast('Select the payment date', 'bad'); return; }
  try {
    await rest('/rest/v1/payments', { method: 'POST', headers: { 'Prefer': 'return=minimal' }, body: JSON.stringify({
      school_id: _schoolId, student_id: id, amount: amount, payment_for: payFor, payment_method: method,
      transaction_id: txn || null, notes: notes || null, paid_at: new Date(dateVal).toISOString()
    })});
    const [students, payments] = await Promise.all([
      rest('/rest/v1/students?id=eq.' + id + '&select=total_expected,functional_fee'),
      rest('/rest/v1/payments?student_id=eq.' + id + '&select=amount,payment_for')
    ]);
    const totalExpected = Number(students[0].total_expected) || 0;
    const schoolPaid = payments.filter(p => p.payment_for !== 'Functional Fees').reduce((sum,p) => sum + Number(p.amount), 0);
    const funcPaid = payments.filter(p => p.payment_for === 'Functional Fees').reduce((sum,p) => sum + Number(p.amount), 0);
    const update = { current_balance: totalExpected - schoolPaid, functional_fee_paid: funcPaid };
    if (payFor === 'Functional Fees') update.functional_fee_status = 'cash';
    await rest('/rest/v1/students?id=eq.' + id, { method: 'PATCH', headers: { 'Prefer': 'return=minimal' }, body: JSON.stringify(update) });
    toast('Payment recorded: ' + fmtUGX(amount), 'ok'); closeModal(); nav(activeRoute);
  } catch(e){ toast(e.message, 'bad'); }
}
window.savePayment = savePayment;

async function viewReport(studentId, examId){
  const [student, exam, subjects, marks, rules, comments] = await Promise.all([
    rest('/rest/v1/students?id=eq.' + studentId + '&select=*').then(r => r[0]),
    rest('/rest/v1/exams?id=eq.' + examId + '&select=*').then(r => r[0]),
    rest('/rest/v1/subjects?school_id=eq.' + _schoolId + '&select=*&order=code'),
    rest('/rest/v1/marks?school_id=eq.' + _schoolId + '&exam_id=eq.' + examId + '&student_id=eq.' + studentId + '&select=*'),
    rest('/rest/v1/grading_rules?school_id=eq.' + _schoolId + '&select=*&order=min_score.desc'),
    rest('/rest/v1/report_comments?student_id=eq.' + studentId + '&exam_id=eq.' + examId + '&select=*').catch(() => [])
  ]);
  function gradeFor(score){ return (rules||[]).find(r => score >= Number(r.min_score) && score <= Number(r.max_score)); }
  let total = 0, count = 0;
  const rows = (subjects||[]).map(sub => {
    const m = (marks||[]).find(x => x.subject_id === sub.id);
    const score = m ? Number(m.score) : null;
    if(score != null){ total += score; count++; }
    const g = score != null ? gradeFor(score) : null;
    return '<tr><td>' + esc(sub.name) + '</td><td style="text-align:center">' + (score != null ? score : '—') + '</td><td style="text-align:center"><b>' + (g ? g.grade : '—') + '</b></td><td>' + (g ? esc(g.remark||'') : '') + '</td></tr>';
  }).join('');
  const avg = count ? total/count : 0;
  const overall = gradeFor(avg);
  const comment = comments && comments[0] ? comments[0].comment : '';
  modal('<div id="rcPrint" style="background:#fff;color:#111;padding:24px;font-family:Inter,sans-serif">' +
    '<div style="text-align:center;padding-bottom:12px;border-bottom:2px solid #111;margin-bottom:14px">' +
      '<h2 style="margin:0;font-size:20px">' + esc(_school.name) + '</h2>' +
      '<div style="font-size:12px">' + esc(_school.address||'') + ' · ' + esc(_school.telephone||'') + '</div>' +
      '<div style="margin-top:8px;font-weight:700">REPORT CARD</div></div>' +
    '<div style="font-size:13px;line-height:1.9;margin-bottom:12px">' +
      '<div><b>Name:</b> ' + esc(student.first_name + ' ' + (student.last_name||'')) + '</div>' +
      '<div><b>Adm No:</b> ' + esc(student.admission_no) + ' · <b>LIN:</b> ' + esc(student.lin||'—') + '</div>' +
      '<div><b>Exam:</b> ' + esc(exam.name) + ' · <b>Year:</b> ' + exam.year + ' T' + exam.term + '</div></div>' +
    '<table style="width:100%;border-collapse:collapse;font-size:13px"><thead><tr style="background:#f1f5f9">' +
      '<th style="border:1px solid #cbd5e1;padding:7px;text-align:left">Subject</th><th style="border:1px solid #cbd5e1;padding:7px">Score</th>' +
      '<th style="border:1px solid #cbd5e1;padding:7px">Grade</th><th style="border:1px solid #cbd5e1;padding:7px;text-align:left">Remark</th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table>' +
    '<div style="margin-top:12px;padding:10px;background:#f1f5f9;border-radius:8px;font-size:13px;display:flex;justify-content:space-between">' +
      '<div><b>Total:</b> ' + total.toFixed(1) + '</div><div><b>Average:</b> ' + avg.toFixed(1) + '</div>' +
      '<div><b>Overall:</b> ' + (overall ? overall.grade : '—') + '</div></div>' +
    (comment ? '<div style="margin-top:12px;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-size:13px"><b>Teacher\'s Comment:</b><br>' + esc(comment) + '</div>' : '') +
    '<div style="text-align:center;font-size:10px;margin-top:16px;color:#64748b">Powered by EUDES MEDIA</div></div>' +
    '<div class="actions"><button class="btn ghost" onclick="closeModal()">Close</button>' +
    '<button class="btn" onclick="printEl(\'rcPrint\')">🖨️ Print</button></div>');
}

      '<div class="table-wrap"><table><thead><tr><th>Name</th><th>Role</th><th>Telephone</th><th>Email</th><th style="text-align:right">Actions</th></tr></thead>' +
      '<tbody>' + staff.map(s => '<tr><td><b>' + esc(s.full_name) + '</b></td><td><span class="badge info">' + esc(s.role||'Staff') + '</span></td>' +
        '<td>' + esc(s.telephone||'—') + '</td><td>' + esc(s.email||'—') + '</td>' +
        '<td style="text-align:right"><button class="btn sm danger" onclick="deleteStaff(\'' + s.id + '\')">✕</button></td></tr>').join('') + '</tbody></table></div>'
      : '<div class="empty">No staff yet.</div>') + '</div>';
}
function addStaff(){
  modal('<h3>Add Staff</h3><div class="grid grid-2"><div><label>Full Name *</label><input id="st_name"></div>' +
    '<div><label>Role</label><select id="st_role"><option>Teacher</option><option>Head Teacher</option><option>Deputy</option><option>Bursar</option><option>Support Staff</option></select></div>' +
    '<div><label>Telephone</label><input id="st_phone"></div><div><label>Email</label><input id="st_email" type="email"></div></div>' +
    '<div class="actions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveNewStaff()">Save</button></div>');
}
window.addStaff = addStaff;
async function saveNewStaff(){
  const name = document.getElementById('st_name').value.trim();
  if(!name){ toast('Name required','bad'); return; }
  try { await rest('/rest/v1/staff', { method: 'POST', headers: { 'Prefer': 'return=minimal' }, body: JSON.stringify({ school_id: _schoolId, full_name: name, role: document.getElementById('st_role').value, telephone: document.getElementById('st_phone').value.trim() || null, email: document.getElementById('st_email').value.trim() || null })}); toast('Added','ok'); closeModal(); nav('staff'); }
  catch(e){ toast(e.message, 'bad'); }
}
window.saveNewStaff = saveNewStaff;
async function deleteStaff(id){ modal('<h3>Delete Staff</h3><p class="muted" style="margin-bottom:16px">Delete this staff member?</p><div class="actions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn danger" onclick="confirmDeleteStaff(\'' + id + '\')">Delete</button></div>'); }
window.deleteStaff = deleteStaff;
async function confirmDeleteStaff(id){ closeModal(); try { await rest('/rest/v1/staff?id=eq.' + id, { method: 'DELETE' }); toast('Deleted','ok'); nav('staff'); } catch(e){ toast(e.message, 'bad'); } }
window.confirmDeleteStaff = confirmDeleteStaff;

// ==================== SETTINGS ====================
let _settingsTab = 'school';
async function pageSettings(root){
  const [rules] = await Promise.all([
    rest('/rest/v1/grading_rules?school_id=eq.' + _schoolId + '&select=*&order=min_score.desc').catch(() => [])
  ]);
  root.innerHTML =
    '<div class="page-head"><div><h1>Settings</h1></div></div>' +
    '<div class="tab-bar" style="display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto">' +
      '<button class="' + (_settingsTab === 'school' ? 'active' : '') + '" style="padding:10px 16px;font-size:13.5px;font-weight:600;border-bottom:2px solid ' + (_settingsTab === 'school' ? 'var(--brand)' : 'transparent') + ';color:' + (_settingsTab === 'school' ? 'var(--brand)' : 'var(--muted)') + '" onclick="_settingsTab=\'school\';nav(\'settings\')">🏫 School</button>' +
      '<button style="padding:10px 16px;font-size:13.5px;font-weight:600;border-bottom:2px solid ' + (_settingsTab === 'grading' ? 'var(--brand)' : 'transparent') + ';color:' + (_settingsTab === 'grading' ? 'var(--brand)' : 'var(--muted)') + '" onclick="_settingsTab=\'grading\';nav(\'settings\')">📊 Grading</button>' +
      '<button style="padding:10px 16px;font-size:13.5px;font-weight:600;border-bottom:2px solid ' + (_settingsTab === 'account' ? 'var(--brand)' : 'transparent') + ';color:' + (_settingsTab === 'account' ? 'var(--brand)' : 'var(--muted)') + '" onclick="_settingsTab=\'account\';nav(\'settings\')">👤 Account</button>' +
      '<button style="padding:10px 16px;font-size:13.5px;font-weight:600;border-bottom:2px solid ' + (_settingsTab === 'danger' ? 'var(--brand)' : 'transparent') + ';color:' + (_settingsTab === 'danger' ? 'var(--brand)' : 'var(--muted)') + '" onclick="_settingsTab=\'danger\';nav(\'settings\')">⚠️ Danger</button>' +
    '</div><div id="settingsContent"></div>';
  const content = document.getElementById('settingsContent');
  if (_settingsTab === 'school'){
    content.innerHTML = '<div style="background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px"><h3>School Profile</h3><div class="grid grid-2">' +
      '<div><label>School Name</label><input id="set_name" value="' + esc(_school.name||'') + '"></div>' +
      '<div><label>Telephone</label><input id="set_phone" value="' + esc(_school.telephone||'') + '"></div>' +
      '<div><label>Address</label><input id="set_addr" value="' + esc(_school.address||'') + '"></div>' +
      '<div><label>Email</label><input id="set_email" value="' + esc(_school.email||'') + '"></div>' +
      '<div><label>Head Teacher</label><input id="set_head" value="' + esc(_school.head_teacher||'') + '"></div>' +
      '<div><label>Motto</label><input id="set_motto" value="' + esc(_school.motto||'') + '"></div></div>' +
      '<div class="actions"><button class="btn" onclick="saveSchoolInfo()">💾 Save</button></div></div>';
  } else if (_settingsTab === 'grading'){
    content.innerHTML = '<div style="background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px"><h3>Grading Rules</h3>' +
      '<div class="table-wrap"><table><thead><tr><th>Min</th><th>Max</th><th>Grade</th><th>Remark</th></tr></thead>' +
      '<tbody>' + (rules||[]).map(r => '<tr><td>' + r.min_score + '</td><td>' + r.max_score + '</td><td><b>' + esc(r.grade) + '</b></td><td>' + esc(r.remark||'') + '</td></tr>').join('') + '</tbody></table></div></div>';
  } else if (_settingsTab === 'account'){
    content.innerHTML = '<div style="background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px"><h3>My Account</h3><div class="grid grid-2">' +
      '<div><label>Full Name</label><input value="' + esc(_profile.full_name||'') + '" disabled></div>' +
      '<div><label>Email</label><input value="' + esc(_profile.email || SESSION.email || '') + '" disabled></div>' +
      '<div><label>Role</label><input value="' + esc((_profile.role||'').replace(/_/g,' ')) + '" disabled></div></div></div>';
  } else if (_settingsTab === 'danger'){
    content.innerHTML = '<div style="background:#fef2f2;border:1px solid #fecaca;border-radius:14px;padding:22px"><h3 style="color:#b91c1c">⚠️ Danger Zone</h3>' +
      '<div style="display:flex;flex-direction:column;gap:12px">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;padding:14px;background:#fff;border-radius:10px;flex-wrap:wrap;gap:10px"><div><b>Delete All Pupils</b><div class="muted">Removes all students, payments, and attendance</div></div><button class="btn danger" onclick="wipeStudents()">Delete All</button></div>' +
        '<div style="display:flex;justify-content:space-between;align-items:center;padding:14px;background:#fff;border-radius:10px;flex-wrap:wrap;gap:10px"><div><b>Delete All Payments</b><div class="muted">Clears all payment records</div></div><button class="btn danger" onclick="wipePayments()">Delete All</button></div>' +
      '</div></div>';
  }
}
window.pageSettings = pageSettings;

async function saveSchoolInfo(){
  const name = document.getElementById('set_name').value.trim();
  if (!name){ toast('School name required', 'bad'); return; }
  try {
    await rest('/rest/v1/schools?id=eq.' + _schoolId, { method: 'PATCH', headers: { 'Prefer': 'return=minimal' }, body: JSON.stringify({
      name: name, telephone: document.getElementById('set_phone').value.trim() || null, address: document.getElementById('set_addr').value.trim() || null,
      email: document.getElementById('set_email').value.trim() || null, head_teacher: document.getElementById('set_head').value.trim() || null, motto: document.getElementById('set_motto').value.trim() || null
    })});
    const schools = await rest('/rest/v1/schools?id=eq.' + _schoolId + '&select=*');
    _school = schools[0]; renderBadge(); toast('Saved', 'ok');
  } catch(e){ toast(e.message, 'bad'); }
}
window.saveSchoolInfo = saveSchoolInfo;
async function wipeStudents(){ modal('<h3>⚠️ Delete All Pupils</h3><p class="muted" style="margin-bottom:16px">Permanently delete ALL pupils and their data?</p><div class="actions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn danger" onclick="confirmWipeStudents()">Yes</button></div>'); }
window.wipeStudents = wipeStudents;
async function confirmWipeStudents(){ closeModal(); try { await rest('/rest/v1/payments?school_id=eq.' + _schoolId, { method: 'DELETE' }); await rest('/rest/v1/attendance?school_id=eq.' + _schoolId, { method: 'DELETE' }); await rest('/rest/v1/students?school_id=eq.' + _schoolId, { method: 'DELETE' }); toast('All pupils deleted', 'ok'); nav('settings'); } catch(e){ toast(e.message, 'bad'); } }
window.confirmWipeStudents = confirmWipeStudents;
async function wipePayments(){ modal('<h3>⚠️ Delete All Payments</h3><p class="muted" style="margin-bottom:16px">Delete all payment records?</p><div class="actions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn danger" onclick="confirmWipePayments()">Yes</button></div>'); }
window.wipePayments = wipePayments;
async function confirmWipePayments(){ closeModal(); try { await rest('/rest/v1/payments?school_id=eq.' + _schoolId, { method: 'DELETE' }); toast('All payments deleted', 'ok'); } catch(e){ toast(e.message, 'bad'); } }
window.confirmWipePayments = confirmWipePayments;

// ==================== STARTUP ====================
async function handleAuthRedirect(){
  const hash = window.location.hash;
  if (hash && hash.includes('access_token')){
    const params = new URLSearchParams(hash.substring(1));
    const access_token = params.get('access_token');
    const refresh_token = params.get('refresh_token');
    if (access_token){
      try {
        const res = await fetch(SUPA_URL + '/auth/v1/user', { headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + access_token } });
        const user = await res.json();
        if (user && user.id){ setSession({ access_token: access_token, refresh_token: refresh_token, user: user }); window.history.replaceState(null, '', window.location.pathname); await boot(); return; }
      } catch (e){ console.error(e); }
    }
  }
  const s = safeStorage.getItem('eudes_session');
  if(s){ try { await boot(); } catch(e){ console.error(e); } }
}
handleAuthRedirect();
</script>
